<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Call | Quinten Gish</title>
<meta name="description" content="Book a paid ads strategy call with Quinten Gish.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#050608; --ink:#F5F7FA; --ink-2:#AEB4BE; --line:rgba(255,255,255,0.07); --accent:#2D8CFF; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--ink); font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); }
  .nav a { color:var(--ink); text-decoration:none; font-weight:600; font-size:15px; display:flex; align-items:center; gap:10px; }
  .nav .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); }
  .nav .back { color:var(--ink-2); font-weight:500; font-size:14px; }
  .form { flex:1; min-height:0; }
  #cal { width:100%; height:100%; min-height:700px; }
</style>
</head>
<body>
  <header class="nav">
    <a href="/"><span class="dot"></span>Quinten Gish</a>
    <a href="/" class="back">Back to site</a>
  </header>
  <main class="form">
    <div id="cal" class="calendly-inline-widget"></div>
  </main>
  <script src="https://assets.calendly.com/assets/external/widget.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var utm = {};
      ['utmSource','utmMedium','utmCampaign','utmContent','utmTerm'].forEach(function (k) {
        var v = q.get(k.replace(/[A-Z]/g, function (c) { return '_' + c.toLowerCase(); }));
        if (v) utm[k] = v;
      });
      function go() {
        Calendly.initInlineWidget({
          url: 'https://calendly.com/quintengish/paid-ads-strategy-call?hide_gdpr_banner=1&background_color=050608&text_color=f5f7fa&primary_color=2d8cff',
          parentElement: document.getElementById('cal'),
          utm: utm
        });
      }
      if (window.Calendly) go(); else window.addEventListener('load', go);
    })();
  </script>
</body>
</html>
