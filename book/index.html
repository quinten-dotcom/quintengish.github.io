<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/accelerator/site.js"></script>
<title>Book a Call | Quinten Gish</title>
<meta name="description" content="Book a paid ads strategy call with Quinten Gish.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#232323;font-family:"Raleway",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;min-height:100vh}
  .topbar{background:#2b2b2b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;font-weight:500;letter-spacing:.02em}
  .topbar a{color:#fff;text-decoration:none}.topbar .back{font-size:14px;opacity:.8}.topbar .back:hover{opacity:1}
  main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:clamp(24px,4vw,48px) 16px 56px}
  #cal{width:100%;min-width:320px;height:760px}
  .footer{background:#2b2b2b;color:#fff;text-align:center;padding:22px 16px 26px;font-size:13px;font-weight:500}
</style>
</head>
<body>
  <header class="topbar"><a href="/">Quinten Gish</a><a class="back" href="/">Back to site</a></header>
  <main><div id="cal" class="calendly-inline-widget"></div></main>
  <footer class="footer">&copy; 2026 Quinten Gish</footer>
  <script src="https://assets.calendly.com/assets/external/widget.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var utm = {};
      ['utmSource','utmMedium','utmCampaign','utmContent','utmTerm'].forEach(function (k) {
        var v = q.get(k.replace(/[A-Z]/g, function (c) { return '_' + c.toLowerCase(); }));
        if (v) utm[k] = v;
      });
      function go() {
        Calendly.initInlineWidget({
          url: 'https://calendly.com/quintengish/paid-ads-strategy-call?hide_gdpr_banner=1&background_color=ffffff&text_color=232323&primary_color=17af84',
          parentElement: document.getElementById('cal'),
          utm: utm
        });
      }
      if (window.Calendly) go(); else window.addEventListener('load', go);
    })();
  </script>
</body>
</html>
