<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../site.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECE8E1">
<title>Apply | AI Creative Strategist Accelerator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://embed.typeform.com/next/css/widget.css">
<style>
  html, body { margin: 0; height: 100%; background: #ECE8E1; color: #14161B; font-family: Inter, system-ui, -apple-system, sans-serif; }
  #form { position: fixed; inset: 0; height: 100vh; height: 100dvh; }
  #form > div, #form iframe { width: 100%; height: 100%; }
  .fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; font-size: 17px; font-weight: 600; }
  .fallback a { color: #14161B; }
  .fallback[hidden] { display: none; }
</style>
</head>
<body>
<div id="form" aria-label="Application form"></div>

<p class="fallback" id="fallback" hidden>The form did not load. <a id="fallback-link" href="https://form.typeform.com/to/flFSQBWR">&nbsp;Open the application here</a>.</p>
<noscript><p class="fallback"><a href="https://form.typeform.com/to/flFSQBWR">Open the application here</a></p></noscript>

<script src="https://embed.typeform.com/next/embed.js"></script>
<script>
(() => {
  const FORM = 'flFSQBWR';
  const KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid',
    'ad_id', 'adset_id', 'campaign_id', 'placement', 'site'];

  /* eid = the Lead event id. The browser Lead (below) and the server Lead (Typeform webhook) both use it,
     which is how Meta knows they are the same lead and counts it once. */
  let eid = '';
  try { eid = crypto.randomUUID(); } catch (e) { eid = 'lead' + Date.now().toString(36) + Math.random().toString(36).slice(2); }

  let ids = { first_touch: {} };
  try { if (window.acsaIds) ids = window.acsaIds(); } catch (e) {}
  const touch = ids.first_touch || {};
  if (!window.acsaIds) {   // site.js blocked: fall back to the raw URL params
    const q = new URLSearchParams(location.search);
    KEYS.forEach((k) => { if (q.get(k)) touch[k] = q.get(k); });
  }

  // hidden fields: only non-empty values
  const hidden = {};
  KEYS.forEach((k) => { if (touch[k]) hidden[k] = String(touch[k]); });
  [['eid', eid], ['vid', ids.vid], ['fbc', ids.fbc], ['fbp', ids.fbp]].forEach(([k, v]) => { if (v) hidden[k] = String(v); });

  const fallback = () => {
    const a = document.getElementById('fallback-link');
    a.href = 'https://form.typeform.com/to/' + FORM + '#' + new URLSearchParams(hidden).toString();
    document.getElementById('fallback').hidden = false;
  };

  try {
    if (!window.tf || !window.tf.createWidget) return fallback();
    window.tf.createWidget(FORM, {
      container: document.getElementById('form'),
      hidden,
      inlineOnMobile: true,
      redirectTarget: '_top',
      autoFocus: true,
      onSubmit: () => {
        try { if (window.acsaTrack) window.acsaTrack('Lead', { content_name: 'ACSA Application' }, { eventId: eid }); } catch (e) {}
      },
    });
  } catch (e) {
    fallback();
  }
})();
</script>
</body>
</html>
