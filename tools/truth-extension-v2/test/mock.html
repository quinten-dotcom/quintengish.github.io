<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Mock Ads Manager</title>

</style></head>
<body>
  <div class="top"><h2>Ads</h2></div>
  <div class="grid">

    <div class="row"><span class="name">Batch108.v4</span><span>Active</span><span>$1,197.53</span></div>
    <div class="row"><span class="name">Batch101.v3</span><span>Active</span><span>$710.61</span></div>
    <div class="row"><span class="name">Some Unknown Ad</span><span>Active</span><span>$50.00</span></div>
  </div>
</body>
</html>
